generator_ckpt: logs_stage2/checkpoint_model_004000/model.pt
allow_partial_generator_ckpt: true
resume_optimizer_state: false
reset_step: true

real_name: Wan2.1-T2V-14B
fake_name: Wan2.1-T2V-1.3B
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
sharding_strategy: hybrid_full

min_num_training_frames: 21
num_training_frames: 21

denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0
wandb_key: YOUR_WANDB_KEY
wandb_entity: YOUR_WANDB_ENTITY
wandb_project: YOUR_WANDB_PROJECT

distribution_loss: dmd_hsa
trainer: score_distillation
global_sink: false
num_frame_per_block: 3
load_raw_video: false
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 27
  sink_size: 0

enable_hsa: true
hsa_distill_weight: 0.1
hsa_distill_only: false
hsa_train_params_only: false
gradient_checkpointing: false

hsa_kv_granularity: mixed
hsa_tau_min: 0.10
hsa_tau_max: 0.95
hsa_budget_floor: 0.08
hsa_budget_cap: 0.13
hsa_routing_reuse: false
hier_kv:
  enabled: true
  page_size_frames: 3
  topk_pages: 7
  pin_last_page: true
  resident_bonus: 0.0
  index_layers: all
  stage1_topk_chunks: 10000
  max_pages_per_chunk: 0
  rerope_retrieved: true
  recache_pinned_on_switch: true
  gpu_max_pages: 8
  cpu_max_pages: 96

adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  apply_to_critic: true
  verbose: false

lr: 1.0e-05
lr_critic: 2.0e-06
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
batch_size: 1
total_batch_size: 64
gradient_accumulation_steps: 1
dfake_gen_update_ratio: 5
ema_weight: 0.99
ema_start_step: 200
max_iters: 8000
log_iters: 500
max_checkpoints: 6

data_path: prompts/train_prompts.txt
switch_prompt_path: prompts/train_switch_prompts.txt
val_data_path: prompts/train_prompts.txt
val_switch_prompt_path: prompts/train_switch_prompts.txt
image_or_video_shape: [1, 240, 16, 60, 104]

streaming_training: true
streaming_chunk_size: 21
streaming_max_length: 240
streaming_min_new_frame: 18
train_first_chunk: true
last_step_only: false
slice_last_frames: 21
switch_mode: random_choice
switch_choices: [21, 39, 57, 75, 93, 111, 129, 147, 165, 183, 201]

vis_interval: 500
vis_ema: false
vis_video_lengths: [240]
val_batch_size: 1

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
