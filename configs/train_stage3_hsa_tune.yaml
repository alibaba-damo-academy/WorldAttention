# Stage 3 - HSA tune.
#
# The final distillation, run with HSA as the active attention, so the model is distilled under the
# attention it will use at inference rather than being handed sparse attention afterwards. Streaming
# rollout with one prompt switch per sample; LoRA adapters plus the HSA parameters are trainable, and
# a small auxiliary distillation term keeps HSA aligned with dense attention. Distills from a
# Wan2.1-T2V-14B teacher into the 1.3B student.
#
#   torchrun --nproc_per_node=8 train.py --config_path configs/train_stage3_hsa_tune.yaml --logdir logs_stage3

generator_ckpt: logs_stage2/checkpoint_model_000500/model.pt
allow_partial_generator_ckpt: true
resume_optimizer_state: false
reset_step: true

real_name: Wan2.1-T2V-14B        # teacher
fake_name: Wan2.1-T2V-1.3B       # critic, initialized from the student
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
sharding_strategy: hybrid_full

denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0

distribution_loss: dmd_hsa
trainer: score_distillation
global_sink: false
num_frame_per_block: 3
load_raw_video: false
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 3

# ---- HSA stage knobs ----
enable_hsa: true
hsa_backend: auto
hsa_distill_weight: 0.1          # auxiliary regularizer on top of the DMD loss
hsa_distill_only: false
hsa_train_params_only: false     # LoRA trains, and the trainer unfreezes the HSA parameters on top
gradient_checkpointing: false    # see Stage 2

adapter:
  type: lora
  rank: 256
  alpha: 256
  dropout: 0.0
  dtype: bfloat16
  apply_to_critic: true
  verbose: false

lr: 1.0e-05
lr_critic: 2.0e-06
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
weight_decay: 1.0e-04
batch_size: 1
gradient_accumulation_steps: 1
dfake_gen_update_ratio: 5
ema_weight: 0.99
ema_start_step: 200
max_iters: 1500
log_iters: 50
max_checkpoints: 3

data_path: prompts/train_prompts.txt
switch_prompt_path: prompts/train_switch_prompts.txt
val_data_path: prompts/train_prompts.txt
val_switch_prompt_path: prompts/train_switch_prompts.txt
image_or_video_shape: [1, 240, 16, 60, 104]

streaming_training: true
streaming_chunk_size: 21
streaming_max_length: 240        # 240 latent frames = 60s at 16 fps
streaming_min_new_frame: 18
train_first_chunk: true
last_step_only: false
slice_last_frames: 21
switch_mode: random_choice       # one switch per sample, drawn from the choices below
switch_choices: [21, 39, 57, 75, 93, 111, 129, 147, 165, 183, 201]

vis_interval: 500
vis_ema: false
vis_video_lengths: [240]
val_batch_size: 1
disable_wandb: true

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
