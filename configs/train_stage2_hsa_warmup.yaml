# Stage 2 - HSA warmup.
#
# Freeze the Stage-1 student and train only the HSA parameters (k_proj_mat, v_proj_mat, gate_lin)
# against the per-layer attention self-distillation signal, which targets the full attention HSA
# replaces. The DMD term is skipped, so no teacher rollout runs and the stage is cheap. The trainer
# initializes the HSA parameters on load, since the Stage-1 checkpoint does not contain them, and
# resets the fusion gate bias to zero so the gate has usable gradient.
#
#   torchrun --nproc_per_node=8 train.py --config_path configs/train_stage2_hsa_warmup.yaml --logdir logs_stage2

generator_ckpt: models/stage1_causal.pt
allow_partial_generator_ckpt: true       # the Stage-1 checkpoint carries no HSA parameters
resume_optimizer_state: false
reset_step: true

real_name: Wan2.1-T2V-1.3B
fake_name: Wan2.1-T2V-1.3B
generator_fsdp_wrap_strategy: size
real_score_fsdp_wrap_strategy: size
fake_score_fsdp_wrap_strategy: size
text_encoder_fsdp_wrap_strategy: size
sharding_strategy: hybrid_full

denoising_step_list: [1000, 750, 500, 250]
warp_denoising_step: true
ts_schedule: false
num_train_timestep: 1000
timestep_shift: 5.0
guidance_scale: 3.0
denoising_loss_type: flow
mixed_precision: true
seed: 0

distribution_loss: dmd_hsa
trainer: score_distillation
global_sink: false
num_frame_per_block: 3
load_raw_video: false
model_kwargs:
  timestep_shift: 5.0
  local_attn_size: 12
  sink_size: 3

# ---- HSA stage knobs ----
enable_hsa: true                 # install HSA on the rollout path
hsa_backend: auto                # sparse branch for the no-grad rollout steps
hsa_distill_only: true           # generator loss is the distillation term alone
hsa_train_params_only: true      # freeze everything except the HSA parameters
hsa_distill_weight: 1.0
adapter: null

# Activation recompute is incompatible with the HSA stages: HSA branches on whether gradients are
# enabled, and the distillation signal is a forward side effect that recompute would defer past the
# point where it is collected. Chunk size is therefore bounded by memory rather than by recompute.
gradient_checkpointing: false

lr: 5.0e-04
lr_critic: 2.0e-06
beta1: 0.0
beta2: 0.999
beta1_critic: 0.0
beta2_critic: 0.999
weight_decay: 1.0e-04
batch_size: 1
gradient_accumulation_steps: 1
dfake_gen_update_ratio: 1
ema_weight: 0.0                  # base frozen, so no EMA
ema_start_step: 100000000
max_iters: 500                   # short; watch hsa_distill_loss plateau in the log
log_iters: 50
max_checkpoints: 2

data_path: prompts/train_prompts.txt
switch_prompt_path: prompts/train_switch_prompts.txt
val_data_path: prompts/train_prompts.txt
val_switch_prompt_path: prompts/train_switch_prompts.txt
image_or_video_shape: [1, 240, 16, 60, 104]

streaming_training: true
streaming_chunk_size: 6
streaming_max_length: 60
streaming_min_new_frame: 3
train_first_chunk: true
last_step_only: false
slice_last_frames: 21
switch_mode: random_choice
switch_choices: [21, 39, 57, 75, 93, 111, 129, 147, 165, 183, 201]

vis_interval: 0
vis_ema: false
vis_video_lengths: [240]
val_batch_size: 1
disable_wandb: true

negative_prompt: '色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，杂乱的背景，三条腿，背景人很多，倒着走'
